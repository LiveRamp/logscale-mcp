# CUSTOMIZE: Update #repo, principalEmail domain, and actionNameReferences for your environment
name: prod_ai_agent_k8s_confirmed_gcp_audit
maxWaitTimeSeconds: 120
description: 'Cross-repo join detection: AI agent kubectl commands (CrowdStrike) confirmed
  by GCP Cloud Audit k8s.io events. Joins on pod name to correlate the endpoint command
  with the server-side audit trail. Shows both the local username and the GCP identity,
  the cluster, project, and the specific GCP audit method.'
enabled: false
queryTimestampType: ingest-timestamp
schedule: 0 * * * *
searchIntervalSeconds: 3600
$schema: https://schemas.humio.com/scheduledsearch/v0.3.0
timeZone: UTC
triggerOnEmptyResult: false
queryString: |-
  #repo=fltr-crowdstrike_data
  | #event_simpleName=ProcessRollup2
  | CommandLine=/kubectl\s+(exec|apply|create|delete|patch|replace|scale|rollout|drain|cordon|run)\s/i
  | (
      ParentBaseFileName="cursorsandbox"
      OR ParentBaseFileName="claude"
      OR ParentBaseFileName=/codex-/i
      OR CommandLine=/cursorsandbox\s+--sandbox-policy/
      OR CommandLine=/\.claude\/shell-snapshots/
      OR CommandLine=/\.codex\//
    )
  | CommandLine != /SNAPSHOT_FILE=|typeset -f|alias.*sed|setopt.*head|--ripgrep/
  | CommandLine != /config view|config current-context|config get-contexts|api-versions|cluster-info|completion|version|which kubectl|get crd|gke-gcloud-auth-plugin|metrics_reporter/i
  | case {
      ParentBaseFileName="cursorsandbox" | agent := "Cursor Agent";
      CommandLine=/cursorsandbox\s+--sandbox-policy/ | agent := "Cursor Agent";
      ParentBaseFileName="claude" | agent := "Claude Code";
      CommandLine=/\.claude\/shell-snapshots/ | agent := "Claude Code";
      ParentBaseFileName=/codex-/i | agent := "OpenAI Codex CLI";
      CommandLine=/\.codex\// | agent := "OpenAI Codex CLI";
      * | agent := "Unknown Agent";
    }
  | case {
      CommandLine=/kubectl\s+exec\s.*metadata\.google\.internal/i | risk := "CRITICAL";
      CommandLine=/kubectl\s+(delete|drain|cordon)\s/i | risk := "HIGH";
      CommandLine=/kubectl\s+exec\s/i | risk := "HIGH";
      CommandLine=/kubectl\s+(apply|create|patch|replace|scale|rollout)\s/i | risk := "HIGH";
      CommandLine=/kubectl\s+run\s/i | risk := "HIGH";
      * | risk := "MED";
    }
  | regex("kubectl[^|;]*-n\s+(?<k8s_ns>[a-z][a-z0-9-]+)", field=CommandLine, strict=false)
  | regex("kubectl\s+exec\s+-n\s+\S+\s+(?<k8s_pod>[a-z0-9][a-z0-9-]+)", field=CommandLine, strict=false)
  | regex("kubectl\s+delete\s+pod\s+(?<k8s_pod>[a-z0-9][a-z0-9-]+)", field=CommandLine, strict=false)
  | regex("kubectl\s+run\s+(?<k8s_pod>[a-z0-9][a-z0-9-]+)", field=CommandLine, strict=false)
  | regex("kubectl\s+apply\s+-f\s+\S+/(?<k8s_pod>[a-z0-9][a-z0-9-]+\.ya?ml)", field=CommandLine, strict=false)
  | k8s_pod=*
  | format(format="%s", field=[CommandLine], as=cmd)
  | regex("COMMAND_EXIT_CODE.*?--\s+(?<cmd>.+)", field=CommandLine, strict=false)
  | join(
      {
        #repo=gcp_cloudaudit
        | protoPayload.serviceName="k8s.io"
        | protoPayload.methodName=/exec|\.create$|\.delete$|\.patch$|\.update$/i
        | protoPayload.methodName != /tokenreviews|subjectaccessreviews/i
        | protoPayload.authenticationInfo.principalEmail=*@liveramp.com
        | regex("pods/(?<k8s_pod>[a-z0-9][a-z0-9-]+)", field=protoPayload.resourceName, strict=false)
        | k8s_pod=*
        | rename(field=protoPayload.authenticationInfo.principalEmail, as=gcp_user)
        | rename(field=protoPayload.methodName, as=gcp_method)
        | rename(field=resource.labels.cluster_name, as=gcp_cluster)
        | rename(field=resource.labels.project_id, as=gcp_project)
      },
      field=k8s_pod, key=k8s_pod, include=[gcp_user, gcp_method, gcp_cluster, gcp_project]
    )
  | default(field=k8s_ns, value="default")
  | groupBy([UserName, gcp_user, agent, risk, k8s_ns, gcp_cluster, gcp_project, gcp_method], function=[count(), collect(k8s_pod, limit=3)])
  | _count > 0
labels:
- ai-agent
- cloud-security
- crowdstrike
- gcp-audit
- cross-repo-join
- playbook:https://liveramp.atlassian.net/wiki/spaces/CI/pages/prod_ai_agent_k8s_confirmed_gcp_audit
actionNameReferences:
- Send to Tines
